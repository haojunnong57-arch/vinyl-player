name: VinylPlayer

options:
  bundleIdPrefix: com.haojunnong
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES

targets:
  VinylPlayer:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VinylPlayer
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.haojunnong.vinylplayer
        PRODUCT_NAME: VinylPlayer
        INFOPLIST_FILE: VinylPlayer/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        SWIFT_EMIT_LOC_STRINGS: NO

schemes:
  VinylPlayer:
    build:
      targets:
        VinylPlayer: all
    run:
      config: Release
    archive:
      config: Release
